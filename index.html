<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ===== Primary SEO ===== -->
    <title>Sierra Campestre | Pasadía desde $45.000 en Santa Marta</title>
    <meta
      name="description"
      content="Pasadía con piscina, tirolesa y almuerzo incluido desde $45.000. Hospedaje, restaurante y eventos cerca de Santa Marta, Magdalena. Reserva por WhatsApp. 4.4★ en Google."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#146c8e" />
    <!-- DUMMY: replace with your real production domain before publishing -->
    <link rel="canonical" href="https://www.sierracampestre.com/" />

    <!-- Best-effort language hints for a single-URL SPA. True per-language SEO
         needs separate URLs (e.g. /en/); see note at bottom of this file. -->
    <link rel="alternate" hreflang="es-co" href="https://www.sierracampestre.com/" />
    <link rel="alternate" hreflang="x-default" href="https://www.sierracampestre.com/" />

    <!-- ===== Open Graph / social ===== -->
    <meta property="og:type" content="business.business" />
    <meta property="og:site_name" content="Sierra Campestre" />
    <meta property="og:title" content="Sierra Campestre | Pasadía desde $45.000 · Santa Marta" />
    <meta
      property="og:description"
      content="Piscina, tirolesa y almuerzo incluido desde $45.000. Hospedaje, restaurante y eventos cerca de Santa Marta, Magdalena."
    />
    <!-- DUMMY: add a real 1200x630 image at public/og-image.jpg -->
    <meta property="og:image" content="https://www.sierracampestre.com/og-image.jpg" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://www.sierracampestre.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sierra Campestre | Santa Marta" />
    <meta name="twitter:description" content="Pasadía, hospedaje, restaurante y eventos cerca de Santa Marta, Magdalena." />
    <meta name="twitter:image" content="https://www.sierracampestre.com/og-image.jpg" />

    <!-- ===== Icons ===== -->
    <!-- DUMMY: add a real favicon at public/favicon.svg -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- ===== Fonts: Fraunces (display) + Karla (body), loaded with preconnect + swap ===== -->

    <!-- =====================================================================
         JSON-LD structured data — kept static in index.html (not injected by
         JS) so search engines can read it even before React hydrates.

         DUMMY VALUES YOU MUST REPLACE:
           - "url": production domain
           - "address": exact street address (only city/department confirmed)
           - "geo": approximate Santa Marta coordinates — replace with your
             real lat/long
           - "openingHoursSpecification": placeholder hours
           - "priceRange": placeholder
         REAL VALUES ALREADY FILLED IN:
           - name, telephone, aggregateRating, review quotes + authors,
             sameAs (Instagram + Google Business profile)
       ===================================================================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LodgingBusiness",
        "name": "Sierra Campestre",
        "description": "Pasadía con piscina, hospedaje, restaurante y eventos campestres cerca de Santa Marta, Magdalena, Colombia.",
        "url": "https://www.sierracampestre.com/",
        "telephone": "+57 301 608 1833",
        "priceRange": "$50.0000",
        "image": ["https://www.sierracampestre.com/og-image.jpg"],
        "address": {
        "@type": "PostalAddress",
        "streetAddress": "Vía Minca, frente a la cancha sintética de Tres Puentes",
        "addressLocality": "Santa Marta",
        "addressRegion": "Magdalena",
        "addressCountry": "CO"
      },
        "geo": {
          "@type": "GeoCoordinates", 
          "latitude": 11.2074,
          "longitude": -74.161
        },
        "sameAs": ["https://www.instagram.com/sierra.campestre/", "https://share.google/ACfExejzW4hhLi1cB"],
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "08:00",
          "closes": "18:00"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.4",
          "reviewCount": "16"
        },
        "review": [
          {
            "@type": "Review",
            "author": { "@type": "Person", "name": "Joseph A Villanueva Z" },
            "reviewRating": { "@type": "Rating", "ratingValue": "5" },
            "reviewBody": "Es un buen sitio para compartir con familia y amigos, cerca de la ciudad, y con un excelente precio, la comida espectacular."
          },
          {
            "@type": "Review",
            "author": { "@type": "Person", "name": "MIGUEL ACOSTA R" },
            "reviewRating": { "@type": "Rating", "ratingValue": "5" },
            "reviewBody": "Buen lugar para pasar en familia. Excelente atención."
          },
          {
            "@type": "Review",
            "author": { "@type": "Person", "name": "ricardo obando" },
            "reviewRating": { "@type": "Rating", "ratingValue": "4" },
            "reviewBody": "Buen sitio para pasar un día de descanso."
          },
          {
            "@type": "Review",
            "author": { "@type": "Person", "name": "Paula Mejía" },
            "reviewRating": { "@type": "Rating", "ratingValue": "5" },
            "reviewBody": "Muy bueno! El sitio está muy bien organizado, muy limpio y bastante amplio. La piscina está súper, muy fresca y el almuerzo excelente!"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
